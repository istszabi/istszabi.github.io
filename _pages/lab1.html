<style>
  #sakktabla {
    border-collapse: collapse;
    margin: 2rem auto;
    border: 6px solid #2b1d0c;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  #sakktabla td {
    width: min(9vw, 60px);
    height: min(9vw, 60px);
    background-color: #f0d9b5; 
    text-align: center;
    vertical-align: middle;
    transition: transform 0.15s ease, background-color 0.2s ease;
  }

  #sakktabla tr:nth-child(odd) td:nth-child(even),
  #sakktabla tr:nth-child(even) td:nth-child(odd) {
    background-color: #b58863; 
  }

  #sakktabla td:hover {
    background-color: #79984e !important; 
    cursor: pointer;
    transform: scale(1.08);
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    z-index: 2;
    position: relative;
  }


  @media (prefers-contrast: more) {
    #sakktabla td {
      background-color: #ffffff;
    }
    #sakktabla tr:nth-child(odd) td:nth-child(even),
    #sakktabla tr:nth-child(even) td:nth-child(odd) {
      background-color: #000000;
    }
  }
</style>
